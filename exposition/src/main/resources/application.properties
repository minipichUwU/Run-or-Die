spring.application.nom=presentation

server.port=8080

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.api-docs.path=/swagger/api-docs
springdoc.swagger-ui.path=/swagger/swagger-ui.html

# infrastructure
spring.datasource.url=jdbc:h2:mem:Run_or_Die_db
spring.datasource.driver-class-nom=org.h2.Driver
spring.datasource.username=username
spring.datasource.password=p

spring.sql.init.mode=always
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true

spring.h2.console.path=/database/h2-console
spring.h2.console.enabled=true

